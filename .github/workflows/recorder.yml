name: Recorder
on:
  workflow_dispatch:
    inputs:
      jst_datetime:
        required: true
        type: string
      duration_minutes:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: iptv-record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Early Record + Cut with Streamlink
        env:
          IPTV_URL: ${{ secrets.IPTV_URL }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          JST: ${{ inputs.jst_datetime }}
          DUR: ${{ inputs.duration_minutes }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq -qq
          pip install -q streamlink

          TARGET=$(TZ=Asia/Tokyo date -d "$JST" +%s)
          NOW=$(date +%s)
          EARLY=$((TARGET - NOW))
          if [ $EARLY -gt 300 ]; then EARLY=300; fi
          if [ $EARLY -lt 60 ]; then EARLY=60; fi

          TOTAL_SECS=$((DUR * 60 + EARLY + 10))
          echo "本来開始 $JST"
          echo "早め開始 ${EARLY}秒前から録画"
          echo "合計録画 ${TOTAL_SECS}秒 (早め${EARLY}s + 本編${DUR}分 + 余裕10s)"

          # 1. 早めから録画開始 - streamlinkで .ts 取得
          # timeoutで録画時間を制御、streamlink側でHLS切断時のリトライを担当
          timeout $TOTAL_SECS streamlink \
            --hls-live-edge 3 \
            --hls-live-restart \
            --stream-timeout 60 \
            --retry-streams 30 \
            --retry-open 30 \
            --http-header "User-Agent=VLC/3.0.20" \
            "$IPTV_URL" best -o rec_raw.ts || true

          if [ ! -f rec_raw.ts ]; then
            echo "rec_raw.ts が作成されませんでした"
            exit 1
          fi
          ls -lh rec_raw.ts

          # 2. 本来の開始時間からカット & 再エンコード
          echo "=== カット: 先頭${EARLY}秒を削除 ==="
          ffmpeg -ss $EARLY -i rec_raw.ts -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 96k -y rec.mp4
          rm rec_raw.ts
          ls -lh rec.mp4

          # 3. R2へアップロード
          curl -s https://rclone.org/install.sh | sudo bash
          rclone config create r2 s3 provider Cloudflare access_key_id "$(echo "$R2_ACCESS_KEY" | tr -d '[:space:]')" secret_access_key "$(echo "$R2_SECRET_KEY" | tr -d '[:space:]')" endpoint "https://$(echo "$R2_ACCOUNT_ID" | tr -d '[:space:]').r2.cloudflarestorage.com" region auto --quiet

          FILE="rec_$(echo $JST | sed 's/[^0-9]/_/g')_${DUR}m.mp4"
          rclone copyto rec.mp4 r2:iptv-archive/videos/"$FILE" --quiet
          rclone copyto r2:iptv-archive/manifest.json ./manifest.json 2>/dev/null || true
          [ -f manifest.json ] || echo '{"videos":[]}' > manifest.json
          URL="$R2_PUBLIC_URL/videos/$FILE"
          jq --arg t "録画 $JST ${DUR}分" --arg f "$FILE" --arg u "$URL" --arg d "$(date -Iseconds)" '.videos |= [{title:$t, filename:$f, url:$u, recorded_at:$d}] + .' manifest.json > new.json
          mv new.json manifest.json
          rclone copyto ./manifest.json r2:iptv-archive/manifest.json --quiet
